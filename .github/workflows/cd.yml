name: "CD Workflow"

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
        - name: Pull docker image
          run: docker pull henryfranz/api-helllo:latest
        - name: Stop docker container
          run: docker stop api-helllo || true
        - name: Remove docker container
          run: docker rm api-helllo || true
        - name: Run docker container
          run: docker run -d --name api-helllo -p 8080:8080 henryfranz/api-helllo:latest