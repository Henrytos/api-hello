name: Exemplo de ci

on:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - reopened

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v3

          - name: Setup java
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'

          - name: Build with Gradle skip tests
            run: ./gradlew build -x test

    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - name: Checkout repository
            uses: actions/checkout@v3

          - name: Setup java
            uses: actions/setup-java@v4
            with:
              distribution: 'temurin'
              java-version: '17'

          - name: Run tests with Gradle
            run: ./gradlew test